# ============================================
# True Love Server - Docker Compose (Windows + Docker Desktop)
# ============================================
#
# 仓库根目录（本文件的上一级 true-love-n）以 bind mount 挂进容器，
# 路径由本文件位置推导，不依赖 Windows 用户名，也不需要 SMB 共享。
# 配置文件来自与 true-love-n 同级 clone 的私有仓库 config-center。
#
# 使用方式（在本文件所在目录执行）：
#   docker compose pull      # 拉取最新镜像
#   docker compose up -d     # 启动/更新容器
#   docker compose logs -f   # 查看日志
#   docker compose ps        # 查看状态
#   docker compose down      # 停止并删除容器
#
# ============================================

services:
  true-love-server:
    # 镜像地址
    image: ghcr.io/oreoft/true-love-server:latest
    
    # 容器名称
    container_name: tl-server
    
    # 重启策略
    restart: unless-stopped

    # 端口映射（Docker Desktop WSL2 模式下 host 网络无效）
    ports:
      - "8088:8088"

    # 添加 host.docker.internal 解析（用于容器内访问 Windows 服务）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 卷挂载
    volumes:
      # 仓库根目录 - 监听列表和与 base 共享的媒体目录
      - ..:/mnt/true-love-n
      # 配置仓库（与 true-love-n 同级 clone 的 config-center），只读；不存在时直接报错，不自动建空目录
      - type: bind
        source: ../../config-center/true-love-n
        target: /mnt/config-center
        read_only: true
        bind:
          create_host_path: false
      # 本地卷 - SQLite 数据库（不放在 Windows 挂载目录上）
      - tl-server-dbs:/app/dbs

    # 启动前把挂载目录里的文件软链到 /app（服务按工作目录的相对路径读写）
    # 共享目录不存在就先建出来；ln -n 保证容器原地重启时替换旧链接，而不是钻进目录里再建一层
    command: >
      /bin/sh -c "
      R=/mnt/true-love-n &&
      ln -sfn /mnt/config-center/true-love-server/config.yaml /app/config.yaml &&
      ln -sfn $$R/true-love-base/listen_chats.json /app/listen_chats.json &&
      for d in wx_imgs moyu-jpg zaobao-jpg gen-img gen-video gen-audio files-save; do
      mkdir -p $$R/true-love-base/$$d && ln -sfn $$R/true-love-base/$$d /app/$$d || exit 1;
      done &&
      exec python -m true_love_server
      "

    # 环境变量
    environment:
      - APP_ENV=prod
      - TZ=Asia/Shanghai
    
    # 健康检查
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8088/health" ]
      interval: 30s      # 检查间隔
      timeout: 10s       # 超时时间
      retries: 3         # 失败重试次数
      start_period: 10s  # 启动等待时间

# 卷定义
volumes:
  # 本地卷 - SQLite 数据库存储（Docker 管理）
  tl-server-dbs: