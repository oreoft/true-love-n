[project]
name = "true-love-base"
version = "0.2.0"
description = "WeChat message processing service based on wxautox4"
requires-python = "==3.12.*"
dependencies = [
    "true-love-common",
    "fastapi>=0.115.0",
    "python-logging-loki>=0.3.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
    "wxautox4>=41.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
true-love-base = "true_love_base.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/true_love_base"]

[tool.uv.sources]
true-love-common = { path = "../true-love-common", editable = true }
